# Concordance runs as two containers: the Node app and PostgreSQL.
#
# There is deliberately no TLS here. The app binds to loopback only and
# expects something in front of it — an existing nginx, or a Caddy container
# you add yourself. Terminating TLS is the operator's job, not this file's.
#
# The camera will not work over plain HTTP on a phone. getUserMedia requires
# a secure context, so whatever sits in front of this must serve HTTPS.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: concordance
      POSTGRES_USER: concordance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concordance -d concordance"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgres://concordance:${POSTGRES_PASSWORD}@db:5432/concordance
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    # Loopback only. Expose it publicly through your reverse proxy, not here.
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  db-data:
